<!-- Imagen fija de portada -->
<div class="portadaimg"></div>

<!-- Contenido que se desplaza por encima -->
<div class="contenido-inicio">

  <div class="bienvenida">
    <h1>Escuela de Danza de Alboraya</h1>
    <p class="subtitulo">Bienvenidas/os al nuevo curso 2026/2027</p>
  </div>

  <!-- Carrusel con flechas -->
  <div class="carrusel-wrapper">

    <button class="carrusel-flecha flecha-izq" (click)="anterior()" aria-label="Anterior">
      ◀
    </button>

    <div class="carrusel" #carrusel>
      <div class="carrusel-track">

        <div class="carrusel-item">
          <img src="assets/danzacl1.jpg" alt="Danza Clásica">
          <p class="pie-foto">DANZA CLÁSICA</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/danzaurb1.jpg" alt="Danza Urbana">
          <p class="pie-foto">DANZA URBANA</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/barre1.jpg" alt="Barre">
          <p class="pie-foto">BARRE</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/latin1.jpg" alt="Latinos">
          <p class="pie-foto">LATINOS</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/heels1.jpg" alt="Heels">
          <p class="pie-foto">HEELS</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/comjazz1.jpg" alt="Commercial & Jazz Funk">
          <p class="pie-foto">COMMERCIAL & JAZZ FUNK</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/bailesoc1.jpg" alt="Baile Social">
          <p class="pie-foto">BAILE SOCIAL</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/bailenov1.jpg" alt="Baile de Novios">
          <p class="pie-foto">BAILE DE NOVIOS</p>
        </div>
        <div class="carrusel-item">
          <img src="assets/comp1.jpg" alt="Competición">
          <p class="pie-foto">COMPETICIÓN</p>
        </div>

      </div>
    </div>

    <button class="carrusel-flecha flecha-der" (click)="siguiente()" aria-label="Siguiente">
      ▶
    </button>

  </div>

</div>
